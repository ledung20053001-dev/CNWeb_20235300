<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CV của Lê Công Dũng - AI / Backend Engineer Intern">
  <title>Lê Công Dũng | AI / Backend Engineer Intern</title>
  <style>
    :root { --navy: #142d4f; --blue: #005b9f; --text: #303030; --page: #fff; --border: #d7d7d7; }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--page);
      border-top: 5px solid var(--border);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .cv { width: min(836px, calc(100% - 40px)); margin: 0 auto; padding: 62px 0 48px; }
    .profile {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 109px;
      gap: 64px;
      align-items: start;
    }
    h1, h2, p { margin-top: 0; }
    h1 {
      margin-bottom: 3px;
      color: var(--navy);
      font-size: clamp(36px, 5vw, 46px);
      line-height: 1.12;
      letter-spacing: .2px;
    }
    .role {
      margin-bottom: 13px;
      color: var(--blue);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: .15px;
    }
    .contact-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 48px;
      max-width: 545px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      line-height: 1.3;
    }
    .contact-list a { color: var(--blue); text-decoration: none; }
    .contact-list a:hover { text-decoration: underline; }
    .contact-list a:focus-visible { border-radius: 2px; outline: 2px solid var(--blue); outline-offset: 3px; }
    .photo {
      display: block;
      width: 109px;
      height: 163px;
      object-fit: cover;
      object-position: center top;
      background: #3020ff;
    }
    .summary { margin-top: 17px; }
    .summary h2 {
      margin-bottom: 10px;
      color: var(--navy);
      font-size: 18px;
      line-height: 1.4;
      letter-spacing: .45px;
    }
    .summary p {
      max-width: 680px;
      margin-bottom: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      line-height: 1.65;
    }
    @media (max-width: 640px) {
      .cv { width: min(100% - 32px, 520px); padding-top: 36px; }
      .profile { grid-template-columns: 1fr; gap: 24px; }
      .photo { grid-row: 1; width: 96px; height: 144px; }
      .contact-list { grid-template-columns: 1fr; gap: 8px; }
      .summary { margin-top: 28px; }
    }
  </style>
</head>
<body>
  <main class="cv">
    <section class="profile" aria-labelledby="profile-name">
      <div class="profile-content">
        <h1 id="profile-name">Lê Công Dũng</h1>
        <p class="role">AI / Backend Engineer Intern</p>
        <ul class="contact-list" aria-label="Thông tin liên hệ">
          <li>Hà Nội, Việt Nam</li>
          <li><a href="tel:+84862619836">0862619836</a></li>
          <li><a href="mailto:ledung20053001@gmail.com">ledung20053001@gmail.com</a></li>
          <li><a href="https://github.com/dung-30" target="_blank" rel="noopener noreferrer">github.com/dung-30</a></li>
        </ul>
      </div>
      <img class="photo" src="cv_photo.jpg" alt="Ảnh chân dung của Lê Công Dũng" width="109" height="163">
    </section>
    <section class="summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Tóm tắt chuyên môn</h2>
      <p>Sinh viên định hướng AI và Backend, yêu thích xây dựng các hệ thống phần mềm ổn định, có khả năng mở rộng và giải quyết những bài toán thực tế.</p>
    </section>
  </main>
</body>
</html>
